<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Contratics SEI Pro Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 370px;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 15px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 9.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 14px;
      font-weight: 800;
      color: #f8fafc;
    }
    p.sub {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 10px;
    }
    .status-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 11px;
      margin-bottom: 10px;
      color: #cbd5e1;
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
      margin-bottom: 10px;
      font-size: 10.5px;
      color: #e2e8f0;
    }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.92; }
    .btn-primary {
      background: #10b981;
      color: #022c22;
    }
    .btn-secondary {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .btn-rollback {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .monitored-box {
      margin-top: 8px;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
    .monitored-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .monitored-list {
      max-height: 125px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .monitored-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10.5px;
    }
    .footer {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #1e293b;
      font-size: 9.5px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div style="display:flex; align-items:center; gap:6px;">
        <h1>Contratics • SEI Pro</h1>
        <span class="badge">Estúdio BPMN 2.0</span>
      </div>
      <div style="font-size:10px; color:#64748b; margin-top:2px;">Monitoramento de Processos, Fluxo, Artefatos & Associados</div>
    </div>
  </div>

  <div id="statusBox" class="status-box">
    Pronto para sincronizar. Mantenha uma aba do Contratics e uma aba do SEI abertas.
  </div>

  <label class="option-row">
    <input type="checkbox" id="chkDeepScan" checked />
    <span>Inspecionar também <strong>Processos Associados</strong> (Pagamentos, Aditivos, Descentralizações)</span>
  </label>

  <button id="btnBatchScan" class="btn btn-primary">
    ⚡ Iniciar Varredura Geral dos Monitorados
  </button>

  <button id="btnSyncCurrent" class="btn btn-secondary">
    🔀 Estúdio de Fluxo: Mapear Processo Aberto no SEI
  </button>

  <button id="btnRollback" class="btn btn-rollback">
    ⏪ Voltar aos Dados Anteriores (Rollback)
  </button>

  <div class="monitored-box">
    <div class="monitored-header">
      <span>Processos Monitorados do Contratics</span>
      <span id="monitoredCountBadge" style="color:#34d399;">0</span>
    </div>
    <div id="monitoredList" class="monitored-list"></div>
  </div>

  <div class="footer">
    Ponto de Restauração Automático salvo antes de cada escrita
  </div>

  <script src="popup.js"></script>
</body>
</html>
